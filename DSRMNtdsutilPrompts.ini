##########################################################################
### PROMPTS FILE
### DSRM NTDSUTIL Password Reset - Lab Starter
### Version v1.20260630.01
##########################################################################

[conditions]

##########################################################################
### Action conditions
##########################################################################

ActionVerify=(expression)[string equal -nocase "<action>" "verifypass"]

##########################################################################
### Standard command prompts
##########################################################################

CmdPrompt=(prompt)(?s).*[A-Za-z]:\\.*> ?$
NtdsPrompt=(prompt)(?s).*ntdsutil(?:\.exe)?:\s*$
DsrmPrompt=(prompt)(?s).*Reset DSRM Administrator Password:\s*$

##########################################################################
### NTDSUTIL DSRM password prompts
##########################################################################

DsrmPasswordPrompt=(prompt)(?s).*Please type password for DS Restore Mode Administrator Account:\s*$
DsrmConfirmPrompt=(prompt)(?s).*Please confirm new password:\s*$

##########################################################################
### Success condition
##########################################################################

PasswordSetSuccess=(prompt)(?s).*Password has been set successfully\..*Reset DSRM Administrator Password:\s*$|(?s).*Password has been set successfully\.\s*$

##########################################################################
### Failure / error conditions
##########################################################################

PasswordMismatch=(prompt)(?s).*password.*do not match.*|(?s).*password.*did not match.*|(?s).*The passwords do not match.*

PasswordPolicyError=(prompt)(?s).*password.*complexity.*|(?s).*password.*policy.*|(?s).*password.*too short.*|(?s).*does not meet.*requirements.*

AccessDenied=(prompt)(?s).*Access is denied.*|(?s).*WIN32 Error Code:\s*0x5.*|(?s).*Logon failure.*|(?s).*user name or password is incorrect.*

ServerError=(prompt)(?s).*RPC server is unavailable.*|(?s).*network path was not found.*|(?s).*No such domain.*|(?s).*DsBind.*failed.*|(?s).*target principal name is incorrect.*|(?s).*server is not operational.*

GenericError=(prompt)(?s).*Error Message:.*|(?s).*WIN32 Error Code:.*|(?s).*failed.*|(?s).*exception.*

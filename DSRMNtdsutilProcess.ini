##########################################################################
### PROCESS FILE
### DSRM NTDSUTIL Password Reset - Lab Starter
### Version v1.20260630.01
###
### Purpose:
###   Reset Directory Services Restore Mode password for a target DC
###   using NTDSUTIL.
###
### Assumptions:
###   1. CPM service account has privilege to reset DSRM password remotely.
###   2. Target account Address field contains the DC name or FQDN.
###   3. CyberArk-generated new password is available as <pmnewpass>.
###   4. Username is vaulted as .\Administrator or <DCName>\Administrator,
###      but username is not used by NTDSUTIL reset.
###
### Supported action:
###   changepass / reconcilepass
###
### Verify:
###   Not supported in this starter because real DSRM verification requires
###   booting the DC into DSRM or another controlled validation method.
##########################################################################

[states]

Start=(spawn)cmd.exe /Q

RunNtdsutil=ntdsutil
EnterDsrmContext=set dsrm password
ResetDsrmPassword=reset password on server <address>
SendNewPassword=<pmnewpass>
ConfirmNewPassword=<pmnewpass>
QuitDsrmContext=q
QuitNtdsutil=q

FailVerifyUnsupported=FAIL(DSRM verify is not supported by this starter plugin. Use Change or Reconcile for lab testing., 8001)
FailPasswordPolicy=FAIL(DSRM password reset failed because the new password did not meet password policy or complexity requirements., 8002)
FailPasswordMismatch=FAIL(DSRM password reset failed because the password confirmation did not match., 8003)
FailAccessDenied=FAIL(DSRM password reset failed because access was denied or the CPM service account lacks required DC privilege., 8004)
FailServerError=FAIL(DSRM password reset failed because the target DC could not be contacted or NTDSUTIL returned a server error., 8005)
FailUnknown=FAIL(DSRM password reset failed. Review TPC/CPM logs and NTDSUTIL output., 8006)

END=

[transitions]

Start, ActionVerify, FailVerifyUnsupported
Start, CmdPrompt, RunNtdsutil
Start, GenericError, FailUnknown

RunNtdsutil, NtdsPrompt, EnterDsrmContext
RunNtdsutil, GenericError, FailUnknown

EnterDsrmContext, DsrmPrompt, ResetDsrmPassword
EnterDsrmContext, GenericError, FailUnknown

ResetDsrmPassword, DsrmPasswordPrompt, SendNewPassword
ResetDsrmPassword, AccessDenied, FailAccessDenied
ResetDsrmPassword, ServerError, FailServerError
ResetDsrmPassword, GenericError, FailUnknown

SendNewPassword, DsrmConfirmPrompt, ConfirmNewPassword
SendNewPassword, PasswordPolicyError, FailPasswordPolicy
SendNewPassword, GenericError, FailUnknown

ConfirmNewPassword, PasswordMismatch, FailPasswordMismatch
ConfirmNewPassword, PasswordPolicyError, FailPasswordPolicy
ConfirmNewPassword, AccessDenied, FailAccessDenied
ConfirmNewPassword, ServerError, FailServerError
ConfirmNewPassword, PasswordSetSuccess, QuitDsrmContext
ConfirmNewPassword, GenericError, FailUnknown

QuitDsrmContext, NtdsPrompt, QuitNtdsutil
QuitDsrmContext, GenericError, FailUnknown

QuitNtdsutil, CmdPrompt, END
QuitNtdsutil, GenericError, FailUnknown

[CPM Parameters Validation]

address, source=FILE, Mandatory=yes, AllowCharacters=.-_
username, source=FILE, Mandatory=no, AllowCharacters=.\-_
pmnewpass, source=ENV, Mandatory=no

[parameters]

PromptTimeout=90
SendHumanMin=25
SendHumanMax=75
EnableTPCLogonPrompts=yes

[Debug Information]

DebugLogFullParsingInfo=no
DebugLogFullExecutionInfo=no
DebugLogDetailBuiltInActions=no
ExpectLog=no
ConsoleOutput=no
